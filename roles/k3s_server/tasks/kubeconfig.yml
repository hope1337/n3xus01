- name: Read admin kubeconfig without logging certificate credentials
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: cluster_kubeconfig_raw
  no_log: true

- name: Create private laptop state directory
  ansible.builtin.file:
    path: "{{ cluster_kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write isolated laptop kubeconfig using the node Tailscale IP
  ansible.builtin.copy:
    dest: "{{ cluster_kubeconfig_path }}"
    mode: "0600"
    content: "{{ cluster_laptop_config | to_nice_yaml }}"
  vars:
    cluster_source_config: "{{ cluster_kubeconfig_raw.content | b64decode | from_yaml }}"
    cluster_laptop_config:
      apiVersion: v1
      kind: Config
      clusters:
        - name: personal-compute-v1
          cluster:
            certificate-authority-data: "{{ cluster_source_config.clusters[0].cluster['certificate-authority-data'] }}"
            server: "https://{{ cluster_tailscale_ip }}:6443"
      contexts:
        - name: personal-compute-v1
          context:
            cluster: personal-compute-v1
            user: personal-compute-v1-admin
      current-context: personal-compute-v1
      users:
        - name: personal-compute-v1-admin
          user: "{{ cluster_source_config.users[0].user }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Report successful provisioning
  ansible.builtin.debug:
    msg: "first-node is Ready; K3s is enabled at boot. On laptop: ./cluster status then ./cluster test."
