- name: Inspect existing ownership marker before all write operations
  ansible.builtin.stat:
    path: "{{ cluster_owner_file }}"
  register: cluster_owner_stat

- name: Check supported Ubuntu and systemd prerequisites
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version in ['22.04', '24.04']
      - ansible_facts.architecture in ['x86_64', 'aarch64']
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: >-
      Use Ubuntu 22.04/24.04, systemd, x86_64/arm64, >=2 CPUs, >=2GB RAM,
      and no swap. V1 does not change swap, boot, or firewall settings.

- name: Require adequate resources and no swap only before initial installation
  ansible.builtin.assert:
    that:
      - ansible_facts.memtotal_mb >= 1800
      - ansible_facts.processor_vcpus >= 2
      - ansible_facts.swaptotal_mb == 0
    fail_msg: "Initial setup needs >=2 CPUs, >=2GB RAM and no swap. Repo does not change swap."
  when: not cluster_owner_stat.stat.exists

- name: Require at least 10GiB free for cluster state and images
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import os,sys; s=os.statvfs('/var/lib'); sys.exit(0 if s.f_bavail*s.f_frsize >= 10*1024**3 else 'Need at least 10GiB free under /var/lib')"
  changed_when: false
  when: not cluster_owner_stat.stat.exists

- name: Read Tailscale status without changing the tailnet
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: cluster_tailscale_status
  changed_when: false

- name: Read tailscale0 IPv4 addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, addr, show, dev, tailscale0]
  register: cluster_interface
  changed_when: false

- name: Require Tailscale boot persistence
  ansible.builtin.command:
    argv: [systemctl, is-enabled, tailscaled]
  register: cluster_tailscale_enabled
  changed_when: false
  failed_when: cluster_tailscale_enabled.stdout != 'enabled'

- name: Check that installed Tailscale supports boot readiness waiting
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, wait, --help]
  changed_when: false

- name: Read resolved SSH destination IPv4 addresses
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ ansible_host }}"]
  register: cluster_ssh_resolution
  changed_when: false

- name: Record the target Tailscale IPv4 address
  ansible.builtin.set_fact:
    cluster_tailnet_ips: >-
      {{ (cluster_tailscale_status.stdout | from_json).TailscaleIPs
         | select('match', '^100\.') | list }}
    cluster_interface_ips: >-
      {{ (cluster_interface.stdout | from_json)[0].addr_info
         | map(attribute='local') | list }}

- name: Require the SSH destination to be this node's Tailscale address
  ansible.builtin.assert:
    that:
      - (cluster_tailscale_status.stdout | from_json).BackendState == 'Running'
      - cluster_tailnet_ips | length == 1
      - cluster_tailnet_ips[0] in cluster_interface_ips
      - cluster_ssh_resolution.stdout.split() | length > 0
      - cluster_ssh_resolution.stdout.split()[0] == cluster_tailnet_ips[0]
    fail_msg: >-
      Tailscale must be Running with tailscale0 and one IPv4 address.
      ansible_host must resolve to that Tailscale IP, not a LAN/public IP.

- name: Set immutable V1 node identity
  ansible.builtin.set_fact:
    cluster_tailscale_ip: "{{ cluster_tailnet_ips[0] }}"
    cluster_expected_owner:
      managed_by: personal-compute-v1
      schema: 2
      cluster_id: "{{ cluster_id }}"
      role: "{{ cluster_role }}"
      data_root: "{{ cluster_data_root }}"
      node_name: "{{ cluster_node_name }}"
      tailscale_ip: "{{ cluster_tailnet_ips[0] }}"
      version: "{{ k3s_version }}"

- name: Read existing ownership marker
  ansible.builtin.slurp:
    src: "{{ cluster_owner_file }}"
  register: cluster_owner_raw
  when: cluster_owner_stat.stat.exists

- name: Require a regular owned marker, not a symlink
  ansible.builtin.assert:
    that:
      - cluster_owner_stat.stat.isreg | default(false)
      - not (cluster_owner_stat.stat.islnk | default(false))
    fail_msg: "Ownership marker must be a regular file. Refusing ambiguous ownership."
  when: cluster_owner_stat.stat.exists

- name: Refuse identity changes and implicit upgrades
  ansible.builtin.assert:
    that:
      - (cluster_owner_raw.content | b64decode | from_json) == cluster_expected_owner
    fail_msg: >-
      Owner/version/IP does not match. V1 does not adopt, upgrade, or rename
      existing clusters. Restore the original config; do not delete the marker.
  when: cluster_owner_stat.stat.exists

- name: Inspect paths belonging to other Kubernetes distributions
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ cluster_foreign_paths }}"
  register: cluster_foreign_stats

- name: Refuse other Kubernetes installations
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "Existing {{ item.item }} detected. No changes made; use a clean target."
  loop: "{{ cluster_foreign_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read system services
  ansible.builtin.service_facts:

- name: Refuse other Kubernetes services
  ansible.builtin.assert:
    that:
      - item not in ansible_facts.services
    fail_msg: "Existing {{ item }} detected. Use a clean target."
  loop: "{{ cluster_foreign_services }}"
  when: item != cluster_service_name ~ '.service'

- name: Refuse additional custom-named K3s services
  ansible.builtin.assert:
    that:
      - ansible_facts.services.keys() | select('match', '^k3s.*\.service$') | difference([cluster_service_name ~ '.service']) | length == 0
    fail_msg: "Other K3s services exist; the official uninstaller is node-wide. Use a clean target."

- name: Inspect K3s paths before claiming a fresh machine
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ cluster_install_paths }}"
  register: cluster_install_stats
  when: not cluster_owner_stat.stat.exists

- name: Refuse to adopt unowned files or services
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - "(cluster_service_name ~ '.service') not in ansible_facts.services"
    fail_msg: "Unowned K3s/Kubernetes files detected ({{ item.item }}). No adoption or overwrite."
  loop: "{{ cluster_install_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not cluster_owner_stat.stat.exists

- name: Inspect owned K3s binary
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: cluster_binary_stat

- name: Read installed version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: cluster_installed_version
  changed_when: false
  when: cluster_binary_stat.stat.exists

- name: Refuse an unexpected installed version
  ansible.builtin.assert:
    that:
      - cluster_binary_stat.stat.isreg | default(false)
      - not (cluster_binary_stat.stat.islnk | default(false))
      - "('k3s version ' ~ k3s_version ~ ' ') in cluster_installed_version.stdout"
    fail_msg: "K3s version differs from the pinned version. V1 never upgrades in place."
  when: cluster_binary_stat.stat.exists

- name: Inspect current server config
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: cluster_config_stat

- name: Read current server config
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: cluster_config_raw
  when: cluster_config_stat.stat.exists
  no_log: true

- name: Compare existing server config without logging its content
  ansible.builtin.set_fact:
    cluster_config_matches: >-
      {{ (cluster_config_raw.content | b64decode | from_yaml) ==
         (lookup('template', 'config.yaml.j2') | from_yaml) }}
  when: cluster_config_stat.stat.exists
  no_log: true

- name: Refuse to overwrite a manually changed config
  ansible.builtin.assert:
    that:
      - cluster_config_stat.stat.isreg | default(false)
      - not (cluster_config_stat.stat.islnk | default(false))
      - cluster_config_matches
    fail_msg: "Existing K3s config differs. Restore it before rerunning; V1 will not overwrite it."
  when: cluster_config_stat.stat.exists

- name: Inspect config drop-ins
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml.d
  register: cluster_config_dropins

- name: Refuse hidden K3s configuration overrides
  ansible.builtin.assert:
    that:
      - not cluster_config_dropins.stat.exists
    fail_msg: "config.yaml.d exists; V1 refuses configuration overrides."

- name: Inspect existing systemd drop-ins
  ansible.builtin.command:
    argv: [systemctl, show, "{{ cluster_service_name }}", --property=DropInPaths, --value]
  register: cluster_systemd_dropins
  changed_when: false
  when: cluster_owner_stat.stat.exists

- name: Refuse extra systemd overrides
  ansible.builtin.assert:
    that:
      - cluster_systemd_dropins.stdout.split() | difference(['/etc/systemd/system/' ~ cluster_service_name ~ '.service.d/10-tailscale.conf']) | length == 0
    fail_msg: "Unexpected systemd overrides exist. V1 will not rewrite or uninstall this modified cluster."
  when: cluster_owner_stat.stat.exists

- name: Inspect the owned systemd drop-in directory
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ cluster_service_name }}.service.d"
  register: cluster_dropin_dir_stat

- name: List all existing systemd drop-in entries, including hidden files
  ansible.builtin.find:
    paths: "/etc/systemd/system/{{ cluster_service_name }}.service.d"
    file_type: any
    hidden: true
  register: cluster_dropin_entries
  when: cluster_dropin_dir_stat.stat.exists

- name: Refuse unknown files in the owned drop-in directory before setup or reset
  ansible.builtin.assert:
    that:
      - cluster_dropin_entries.files | map(attribute='path') | difference(['/etc/systemd/system/' ~ cluster_service_name ~ '.service.d/10-tailscale.conf']) | length == 0
      - not (cluster_dropin_dir_stat.stat.islnk | default(false))
    fail_msg: "Unknown file/symlink in k3s.service.d. V1 will not overwrite/delete it."
  when: cluster_dropin_dir_stat.stat.exists

- name: Check previously recorded service and uninstall script integrity
  ansible.builtin.import_tasks: integrity.yml

- name: Read TCP listeners on a fresh target
  ansible.builtin.command:
    argv: [ss, -H, -ltn]
  register: cluster_listeners
  changed_when: false
  when: not cluster_owner_stat.stat.exists

- name: Refuse conflicting Kubernetes ports
  ansible.builtin.assert:
    that:
      - "cluster_listeners.stdout is not regex(':(6443|6444|10250)\\s')"
    fail_msg: "A Kubernetes port is already occupied (6443/6444/10250). No changes made."
  when: not cluster_owner_stat.stat.exists

- name: Inspect network routes for overlap with K3s defaults
  ansible.builtin.command:
    argv: [ip, -j, -4, route, show, table, all]
  register: cluster_routes
  changed_when: false

- name: Verify default Pod and Service CIDRs do not overlap existing routes
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import ipaddress, json, sys
        pools = [ipaddress.ip_network('10.42.0.0/16'), ipaddress.ip_network('10.43.0.0/16')]
        conflicts = []
        for route in json.loads(sys.argv[1]):
            dst = route.get('dst', 'default')
            if dst == 'default':
                continue
            network = ipaddress.ip_network(dst, strict=False)
            if network.prefixlen == 0:
                continue
            if route.get('dev', '') in ('cni0', 'flannel.1') and sys.argv[2] == 'owned':
                continue
            if any(network.overlaps(pool) for pool in pools):
                conflicts.append(dst)
        if conflicts:
            sys.exit('CIDR overlap: ' + ', '.join(conflicts) + '. Use a clean non-overlapping network; V1 will not rewrite routes.')
      - "{{ cluster_routes.stdout }}"
      - "{{ 'owned' if cluster_owner_stat.stat.exists else 'fresh' }}"
  changed_when: false

- name: Inspect optional UFW executable
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: cluster_ufw_binary

- name: Read firewall status without modifying it
  ansible.builtin.command:
    argv: [/usr/sbin/ufw, status]
  register: cluster_ufw
  changed_when: false
  when: cluster_ufw_binary.stat.exists
  environment:
    LC_ALL: C

- name: Explain active firewall handling
  ansible.builtin.debug:
    msg: >-
      UFW is active. Repo will not disable it or add rules. Existing policy must
      allow tailnet API traffic and local Pod networking. See docs/troubleshooting.md.
  when:
    - cluster_ufw_binary.stat.exists
    - "'Status: active' in cluster_ufw.stdout | default('')"

- name: Require a regular sudo user for dataset and result ownership
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Record non-root workload identity
  ansible.builtin.set_fact:
    cluster_user_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] | int }}"
    cluster_user_gid: "{{ ansible_facts.getent_passwd[ansible_user][2] | int }}"

- name: Validate data path independently of the CLI
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os,sys
        path = sys.argv[1]
        assert path.startswith(('/srv/','/data/','/mnt/','/home/')), 'Data must be outside K3s/system paths'
        assert os.path.normpath(path) == path and '..' not in path.split('/'), 'Use a normalized path'
        assert not any(c in path for c in '\n\r\0'), 'Invalid path'
        current = path
        while current != '/':
            assert not os.path.islink(current), 'Symlink data path/ancestor is refused'
            current = os.path.dirname(current)
        assert int(sys.argv[2]) > 0, 'Use a non-root Ubuntu SSH user with sudo'
      - "{{ cluster_data_root }}"
      - "{{ cluster_user_uid }}"
  changed_when: false

- name: Check NVIDIA hardware and driver without changing an existing driver
  ansible.builtin.import_tasks: gpu_preflight.yml
  when: cluster_gpu | bool and not (cluster_reset_mode | default(false) | bool)
