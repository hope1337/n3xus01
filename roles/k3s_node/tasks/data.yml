- name: Inspect data directories without modifying existing files or permissions
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ cluster_data_root }}"
    - "{{ cluster_data_root }}/datasets"
    - "{{ cluster_data_root }}/checkpoints"
    - "{{ cluster_data_root }}/results"
  register: cluster_data_stats

- name: Require existing data paths to be directories, not symlinks
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
    fail_msg: "{{ item.item }} is not a regular directory. Repo will not replace it."
  loop: "{{ cluster_data_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create only missing dataset/checkpoint/result directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ cluster_user_uid | string }}"
    group: "{{ cluster_user_gid | string }}"
    mode: "0750"
  loop: "{{ cluster_data_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Verify workload user can read data and write results without changing permissions
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os,sys
        root=sys.argv[1]
        for part,mode in [('datasets',os.R_OK|os.X_OK),('checkpoints',os.R_OK|os.W_OK|os.X_OK),('results',os.R_OK|os.W_OK|os.X_OK)]:
            assert os.access(root+'/'+part,mode), 'Adjust permissions for your SSH user: '+root+'/'+part
      - "{{ cluster_data_root }}"
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Create private device metadata directory on host
  ansible.builtin.file:
    path: "{{ cluster_state_dir }}/nodes"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Record device address, data location and workload identity on host
  ansible.builtin.copy:
    dest: "{{ cluster_state_dir }}/nodes/{{ cluster_node_name }}.json"
    mode: "0600"
    content: "{{ cluster_device_info | to_nice_json }}\n"
  vars:
    cluster_device_info:
      cluster_id: "{{ cluster_id }}"
      tailscale_ip: "{{ cluster_tailscale_ip }}"
      role: "{{ cluster_role }}"
      gpu: "{{ cluster_gpu | bool }}"
      data_root: "{{ cluster_data_root }}"
      uid: "{{ cluster_user_uid | int }}"
      gid: "{{ cluster_user_gid | int }}"
  delegate_to: localhost
  become: false
