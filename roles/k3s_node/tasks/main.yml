- name: Run read-only safety checks
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare NVIDIA support when explicitly requested
  ansible.builtin.import_tasks: gpu.yml
  when: cluster_gpu | bool

- name: Install and start the owned K3s server
  ansible.builtin.import_tasks: install.yml

- name: Export a private kubeconfig to the laptop
  ansible.builtin.import_tasks: kubeconfig.yml
  when: cluster_role == 'server'

- name: Prepare persistent data directories and export device information
  ansible.builtin.import_tasks: data.yml
