- name: Require supported NVIDIA compute architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'x86_64'
    fail_msg: "This GPU flow targets Ubuntu x86_64 NVIDIA devices, including RTX 4090."

- name: Inspect NVIDIA display/compute hardware
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import pathlib,sys
        devices=[]
        for p in pathlib.Path('/sys/bus/pci/devices').iterdir():
            if (p/'vendor').read_text().strip() == '0x10de' and (p/'class').read_text().startswith('0x03'):
                devices.append(p.name)
        if not devices:
            sys.exit('No NVIDIA display/compute GPU found. Do not use --gpu on this device.')
        print(', '.join(devices))
  changed_when: false

- name: Check the existing driver without installing or replacing it
  ansible.builtin.command:
    argv: [nvidia-smi, -L]
  register: cluster_gpu_driver
  changed_when: false
  failed_when: false

- name: Inspect existing NVIDIA driver packages
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${db:Status-Status} ${Package}\n', 'nvidia-driver-*']
  register: cluster_gpu_driver_packages
  changed_when: false
  failed_when: false

- name: Refuse to overwrite a present but nonfunctional driver
  ansible.builtin.assert:
    that:
      - cluster_gpu_driver.rc == 0 or 'installed nvidia-driver-' not in cluster_gpu_driver_packages.stdout
    fail_msg: >-
      NVIDIA driver is installed but nvidia-smi fails. Reboot the device first,
      check Secure Boot/MOK if required, then rerun add-device. No driver replacement attempted.
