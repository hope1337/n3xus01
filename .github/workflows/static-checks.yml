name: Static checks (no cluster access)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Bash, YAML, safety tests, and Ansible syntax
        run: bash ./cluster check
