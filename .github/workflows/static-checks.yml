name: Device CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux integration prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python tests/static_check.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bash launcher syntax
        if: runner.os == 'Linux'
        run: bash -n n3xus
      - name: Native PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_windows_launcher.ps1
