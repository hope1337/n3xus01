# Adapted from NVIDIA's v0.17.1 static manifest (Apache-2.0).
# https://github.com/NVIDIA/k8s-device-plugin/blob/v0.17.1/deployments/static/nvidia-device-plugin.yml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: personal-compute-nvidia
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: personal-compute-v1
spec:
  selector:
    matchLabels:
      app: personal-compute-nvidia
  template:
    metadata:
      labels:
        app: personal-compute-nvidia
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        personal-compute/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "true"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
