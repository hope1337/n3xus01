- name: Explicitly uninstall only the selected owned device, preserving separate data directories
  hosts: k3s_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - ../roles/k3s_node/defaults/main.yml
  vars:
    cluster_reset_mode: true
  pre_tasks:
    - name: Require explicit destructive confirmation and a single selected device
      ansible.builtin.assert:
        that:
          - cluster_confirm_reset | default(false) | bool
          - ansible_play_hosts_all | length == 1
          - cluster_role in ['server', 'worker']
          - cluster_role != 'server' or groups['k3s_nodes'] | length == 1
        fail_msg: "Reset is explicit and node-wide. Reset registered workers before the server."
    - name: Inspect owner marker before deletion
      ansible.builtin.stat:
        path: "{{ cluster_owner_file }}"
      register: reset_owner_stat
    - name: Refuse an unowned or already-reset device
      ansible.builtin.assert:
        that:
          - reset_owner_stat.stat.exists
        fail_msg: "No owner marker. Nothing will be removed."
  tasks:
    - name: Recheck ownership, configuration and artifact integrity (not GPU installation)
      ansible.builtin.include_role:
        name: k3s_node
        tasks_from: preflight
    - name: Inspect Tailscale protection before cleanup
      ansible.builtin.slurp:
        src: /usr/local/bin/k3s-killall.sh
      register: reset_cleanup_script
    - name: Refuse cleanup that changes Tailscale routes
      ansible.builtin.assert:
        that:
          - "(reset_cleanup_script.content | b64decode) is not regex('(?m)^[ \\t]*tailscale set --advertise-routes=')"
        fail_msg: "Unsafe cleanup script; rerun setup to finish the guard first."
    - name: Uninstall K3s using the fingerprinted official uninstaller
      ansible.builtin.command:
        argv: [/bin/sh, "/usr/local/bin/{{ cluster_service_name }}-uninstall.sh"]
      environment:
        K3S_DATA_DIR: /var/lib/rancher/k3s
      changed_when: true
    - name: Remove only the known owned drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ cluster_service_name }}.service.d"
        state: absent
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Remove only the fixed cluster ownership directory
      ansible.builtin.file:
        path: /var/lib/personal-compute-v1
        state: absent
