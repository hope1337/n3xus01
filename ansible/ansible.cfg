[defaults]
# Ansible resolves these paths relative to this configuration file.
inventory = ../inventory/hosts.example.yml
roles_path = ../roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
timeout = 30
gathering = explicit
display_args_to_stdout = False
local_tmp = ../.cluster/ansible-tmp

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o BatchMode=yes
